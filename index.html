<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>Ombor hisobi</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ombor">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;
  --bg:#ececee;--card:#fff;--soft:#f4f4f6;--ink:#111113;--mute:#8b8b92;--line:#e6e6ea;
  --acc:#ff5b14;--acc2:#ff8a3d;--in:#16a34a;--inbg:#e7f6ec;--out:#dc2626;--outbg:#fdecec;--plan:#8b5cf6;--planbg:#f1ecfe;
  --panel:#f7f7f9;--field:#fff;--track:#efeff2;--navbg:rgba(236,236,238,.75);--warnbg:#fff3e8;--warnfg:#9a3f05;--sh:rgba(0,0,0,.06);
  --r:22px;--font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
html[data-theme=dark]{color-scheme:dark;--bg:#0d0e10;--card:#17181b;--soft:#212327;--ink:#f3f3f5;--mute:#8d8f97;--line:#26282d;
  --inbg:rgba(34,197,94,.14);--in:#22c55e;--outbg:rgba(239,68,68,.15);--out:#f87171;--planbg:rgba(139,92,246,.18);--plan:#a78bfa;
  --panel:#111215;--field:#1c1d21;--track:#26282d;--navbg:rgba(13,14,16,.7);--warnbg:rgba(255,120,40,.12);--warnfg:#ffb27a;--sh:rgba(0,0,0,.4)}
body,.card,.stat,.mini,.list,.panel,.tab,.sq,.pillbtn,.day .dn,.nav button,.field,.sheet{transition:background-color .35s,color .35s,border-color .35s}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:inherit}
.hidden{display:none!important}

/* ============ LOCK ============ */
#lock{position:fixed;inset:0;z-index:100;background:#0b0b0c;display:flex;flex-direction:column;transition:opacity .5s ease,transform .5s ease}
#lock.gone{opacity:0;transform:scale(1.04);pointer-events:none}
.lk-top{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:120px}
.lk-logo{width:62px;height:62px;border-radius:20px;background:linear-gradient(145deg,#ff7a33,#ff4d00);display:grid;place-items:center;box-shadow:0 10px 40px rgba(255,91,20,.35)}
.lk-name{text-align:center;color:#fff;font-weight:700;font-size:17px;letter-spacing:-.01em}
.lk-name span{color:#6d6d74;font-weight:500;display:block;text-align:center;font-size:13px;margin-top:3px}
.lk-sheet{background:#18181a;border-radius:30px 30px 0 0;padding:12px 22px calc(22px + env(safe-area-inset-bottom));position:relative;overflow:hidden;transform:translateY(0);transition:transform .55s cubic-bezier(.2,.8,.2,1)}
#lock.gone .lk-sheet{transform:translateY(100%)}
.lk-handle{width:38px;height:4px;border-radius:4px;background:#3a3a3e;margin:0 auto 22px}
.lk-title{color:#fff;font-size:21px;font-weight:700;text-align:center;letter-spacing:-.02em;transition:opacity .3s}
.lk-sub{color:#7a7a82;font-size:13.5px;text-align:center;line-height:1.5;margin-top:8px;min-height:40px;transition:color .2s}
.lk-sub.err{color:#ff6a5a}
.pins-wrap{position:relative;height:96px;display:flex;align-items:center;justify-content:center;margin:12px 0 6px}
.pins{display:flex;gap:12px}
.pin{width:58px;height:64px;border-radius:16px;border:1.5px solid #2c2c31;background:#1d1d20;display:grid;place-items:center;color:#fff;font-size:24px;font-weight:600;position:relative;transition:transform .55s cubic-bezier(.5,0,.2,1),border-color .2s,box-shadow .3s,background .3s,opacity .3s}
.pin::before{content:"";position:absolute;top:-10px;left:50%;width:18px;height:3px;border-radius:3px;background:var(--acc);transform:translateX(-50%) scaleX(0);transition:transform .25s}
.pin.f::before{transform:translateX(-50%) scaleX(1)}
.pin.a{border-color:var(--acc);box-shadow:0 0 0 4px rgba(255,91,20,.12)}
.pin .dg{transition:opacity .2s,transform .2s}
.pin .dot{width:10px;height:10px;border-radius:50%;background:#fff}
.pins.err .pin{border-color:#ff4d3d;animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.pins.merge .pin{border-color:var(--acc);background:#2a1a12;box-shadow:0 0 40px rgba(255,91,20,.55),inset 0 0 18px rgba(255,91,20,.35)}
.pins.merge .pin::before{transform:translateX(-50%) scaleX(0)}
.pins.merge .pin .dg{opacity:0;transform:scale(.5)}
.pins.merge .pin{transform:translateX(var(--tx)) rotate(var(--rot))}
.pins.six{gap:8px}.pins.six .pin{width:46px;height:56px;border-radius:14px;font-size:21px}
#nameBox{margin:14px 0 8px}
#nameBox input{width:100%;height:58px;border-radius:18px;border:1.5px solid #2c2c31;background:#1d1d20;color:#fff;font:600 18px var(--font);padding:0 18px;outline:none;transition:border-color .2s,box-shadow .2s}
#nameBox input:focus{border-color:var(--acc);box-shadow:0 0 0 4px rgba(255,91,20,.12)}
#nameBox button{width:100%;height:56px;border-radius:18px;background:var(--acc);color:#fff;font-weight:700;font-size:16px;margin-top:10px;box-shadow:0 8px 22px rgba(255,91,20,.35)}
.pins.fade .pin{opacity:0}
.okbox{position:absolute;left:50%;top:50%;width:66px;height:70px;margin:-35px 0 0 -33px;border-radius:18px;border:1.5px solid var(--acc);background:#2a1a12;display:grid;place-items:center;opacity:0;transform:scale(.85);transition:opacity .35s,transform .45s cubic-bezier(.2,1.4,.4,1);box-shadow:0 0 50px rgba(255,91,20,.6),0 0 120px rgba(255,91,20,.25),inset 0 0 20px rgba(255,91,20,.35)}
.okbox.on{opacity:1;transform:scale(1)}
.okbox path{stroke-dasharray:40;stroke-dashoffset:40;transition:stroke-dashoffset .45s .15s ease}
.okbox.on path{stroke-dashoffset:0}
.glow{position:absolute;left:50%;top:150px;width:320px;height:320px;margin-left:-160px;border-radius:50%;background:radial-gradient(circle,rgba(255,91,20,.28),transparent 65%);opacity:0;transition:opacity .6s;pointer-events:none}
.glow.on{opacity:1}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;transition:opacity .3s}
.pad.off{opacity:.25;pointer-events:none}
.key{height:60px;border-radius:18px;background:#222225;color:#fff;font-size:24px;font-weight:500;display:grid;place-items:center;transition:background .12s,transform .12s;user-select:none}
.key:active{background:#333338;transform:scale(.96)}
.key.ghost{background:none}
.key small{display:block;font-size:9px;letter-spacing:.18em;color:#6b6b72;margin-top:-4px}
.lk-foot{text-align:center;margin-top:16px;font-size:13px;color:#6d6d74;min-height:18px}
.lk-foot button{color:#fff;font-weight:600}

/* ============ APP ============ */
#app{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 120px;opacity:0;transition:opacity .5s .15s}
#app.show{opacity:1}
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.sq{width:48px;height:48px;border-radius:16px;background:var(--card);display:grid;place-items:center;flex:none;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.hello{flex:1;min-width:0}
.hello b{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;letter-spacing:-.02em}
.hello span{font-size:12.5px;color:var(--mute)}
.pillbtn{height:48px;padding:0 6px;border-radius:16px;background:var(--card);display:flex;align-items:center;gap:4px}
.pillbtn button{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.pillbtn button:active{background:var(--soft)}
h2.sec{font-size:20px;font-weight:600;letter-spacing:-.02em;margin:22px 2px 12px;display:flex;align-items:center;gap:8px}
h2.sec .sp{flex:1}
h2.sec small{font-size:13px;color:var(--mute);font-weight:500}
.link{font-size:13.5px;font-weight:600;color:var(--acc)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:20px;padding:12px;display:flex;gap:12px;align-items:center;border:1px solid rgba(0,0,0,.03)}
.stat .ic{width:50px;height:50px;border-radius:15px;background:var(--soft);display:grid;place-items:center;flex:none}
.stat .lb{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .vl{font-size:26px;font-weight:600;letter-spacing:-.03em;display:flex;align-items:center;gap:6px;margin-top:2px}
.chip{font-size:11px;font-weight:600;padding:3px 7px;border-radius:7px;letter-spacing:0;white-space:nowrap}
.chip.g{background:var(--inbg);color:var(--in)}.chip.r{background:var(--outbg);color:var(--out)}.chip.p{background:var(--planbg);color:var(--plan)}.chip.n{background:var(--soft);color:var(--mute)}

.days{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin:0 -2px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:1 0 46px;text-align:center}
.day .wd{font-size:12px;color:var(--mute);font-weight:500;margin-bottom:8px}
.day .dn{height:46px;border-radius:14px;background:var(--card);display:grid;place-items:center;font-size:16px;font-weight:600;position:relative;border:1px solid rgba(0,0,0,.04);transition:.2s}
.day.on .wd{color:var(--ink);font-weight:700}
.day.on .dn{background:var(--ink);color:var(--bg)}
.day.on .dn::after{content:"";position:absolute;bottom:-9px;left:50%;width:18px;height:3px;border-radius:3px;background:var(--ink);transform:translateX(-50%)}
.day.fut .dn{color:#b9b9c0}
.day .mk{position:absolute;top:6px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--acc)}
.day.on .mk{background:var(--acc2)}

.tabs{display:flex;gap:6px;background:var(--soft);padding:5px;border-radius:18px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 16px;border-radius:14px;font-size:14px;font-weight:500;white-space:nowrap;background:var(--card);color:var(--ink);border:1px solid rgba(0,0,0,.03)}
.tab.on{color:var(--acc);font-weight:600}
.panel{background:var(--panel);border-radius:26px;padding:8px;border:1px solid rgba(0,0,0,.03)}
.panel>.card{margin-top:8px}

.card{background:var(--card);border-radius:var(--r);padding:18px;border:1px solid rgba(0,0,0,.035)}
.hero{display:flex;align-items:center;gap:10px}
.hero .lb{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.hero .big{font-size:52px;font-weight:800;letter-spacing:-.045em;line-height:1;margin:8px 0 4px;display:flex;align-items:baseline;gap:8px}
.hero .big small{font-size:18px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.hero .big.neg{color:var(--out)}
.hero .rest{font-size:14px;color:var(--mute)}
.ring{width:118px;height:118px;flex:none;position:relative}
.ring svg{transform:rotate(135deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-size:22px;font-weight:700;letter-spacing:-.02em}
.ring .c span{font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--mute)}
.mini3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.mini{background:var(--card);border-radius:18px;padding:12px;border:1px solid rgba(0,0,0,.035);min-width:0}
.mini .lb{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--mute);display:flex;align-items:center;gap:5px}
.mini .vl{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:6px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .vl small{font-size:12px;color:var(--mute);font-weight:500}
.bar{height:6px;border-radius:6px;background:var(--soft);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:6px;transition:width .6s}
.mini .ft{font-size:11px;color:var(--mute);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.qbtn{height:52px;border-radius:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px}
.qbtn.i{background:var(--inbg);color:var(--in)}.qbtn.o{background:var(--outbg);color:var(--out)}
.warn{margin-top:10px;padding:11px 13px;border-radius:14px;background:var(--warnbg);color:var(--warnfg);font-size:13px;line-height:1.45}
.info{margin-top:10px;padding:11px 13px;border-radius:14px;background:var(--planbg);color:#5b35c9;font-size:13px;line-height:1.45}

.list{background:var(--card);border-radius:var(--r);padding:4px 16px;border:1px solid rgba(0,0,0,.035)}
.it{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.it:last-child{border:0}
.it .ib{width:48px;height:48px;border-radius:14px;background:var(--soft);display:grid;place-items:center;flex:none}
.it .mid{flex:1;min-width:0}
.it .nm{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .tg{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.it .tg span{font-size:11.5px;font-weight:500;padding:3px 7px;border-radius:7px;background:var(--soft);color:#55555c}
.it .tm{font-size:12px;color:var(--mute);margin-right:4px;white-space:nowrap}
.it .amt{text-align:right;min-width:52px}
.it .amt b{display:block;font-size:17px;font-weight:700;letter-spacing:-.02em}
.it .amt span{font-size:11px;color:var(--mute)}
.x{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#a0a0a7;flex:none}
.x:active{background:var(--soft)}
.empty{text-align:center;padding:34px 18px;color:var(--mute);font-size:14px;line-height:1.55}
.empty .em{width:70px;height:70px;border-radius:22px;background:var(--card);display:grid;place-items:center;margin:0 auto 14px}
.btn{height:52px;padding:0 20px;border-radius:16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px;background:var(--soft)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.acc{background:var(--acc);color:#fff;box-shadow:0 8px 20px rgba(255,91,20,.28)}
.btn.red{background:var(--outbg);color:var(--out)}
.btn.w{width:100%}
.btn:active{transform:scale(.98)}

.chart{width:100%;height:auto;display:block}
.sel{display:flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:12px;background:var(--soft);font-size:13.5px;font-weight:500}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:12px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;color:var(--mute);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
tr:last-child td{border:0}

/* glowing theme switch */
.tsw{position:relative;width:66px;height:36px;border-radius:20px;flex:none;background:linear-gradient(180deg,#e2e2e7,#ececf0);box-shadow:inset 0 2px 5px rgba(0,0,0,.12),0 0 0 1px rgba(0,0,0,.04);transition:background .4s,box-shadow .4s}
.tsw .kn{position:absolute;top:3px;left:3px;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#f3f3f6 60%,#e4e4ea);display:grid;place-items:center;
  box-shadow:0 0 0 1.5px rgba(255,150,60,.9),0 0 10px rgba(255,140,40,.7),0 0 22px rgba(255,140,40,.35),0 2px 4px rgba(0,0,0,.15);transition:transform .45s cubic-bezier(.5,1.6,.4,1),background .4s,box-shadow .4s}
.tsw svg{position:absolute;transition:opacity .3s,transform .45s}
.tsw .sun{color:#ff7a1a}.tsw .moon{color:#4fb4ff;opacity:0;transform:rotate(-60deg) scale(.6)}
html[data-theme=dark] .tsw{background:linear-gradient(180deg,#050506,#0c0d0f);box-shadow:inset 0 2px 6px rgba(0,0,0,.8),0 0 0 1px rgba(80,170,255,.18)}
html[data-theme=dark] .tsw .kn{transform:translateX(30px);background:radial-gradient(circle at 40% 35%,#2b2e34,#16181c 70%);
  box-shadow:0 0 0 1.5px rgba(90,180,255,.95),0 0 10px rgba(60,160,255,.85),0 0 24px rgba(60,160,255,.45),inset 0 0 6px rgba(80,170,255,.25)}
html[data-theme=dark] .tsw .sun{opacity:0;transform:rotate(60deg) scale(.6)}
html[data-theme=dark] .tsw .moon{opacity:1;transform:none}
/* search */
.search{display:flex;align-items:center;gap:10px;height:52px;padding:0 8px 0 16px;border-radius:18px;background:var(--card);border:1px solid rgba(0,0,0,.035);margin-bottom:6px;color:var(--mute)}
.search input{flex:1;min-width:0;border:0;outline:none;background:none;font-size:15.5px;color:var(--ink);height:100%}
.search input::placeholder{color:var(--mute)}
.search .clr{width:34px;height:34px;border-radius:12px;display:grid;place-items:center}
#sres:empty{display:none}
#sres{margin-bottom:8px}
.lk-credit{text-align:center;margin-top:18px;font-size:12px;color:#55555c;letter-spacing:.02em}
.lk-credit b{color:#a1a1a8;font-weight:600}
/* bottom nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:20;padding:6px;border-radius:40px;background:var(--navbg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.nav button{width:62px;height:56px;border-radius:30px;background:var(--card);display:grid;place-items:center;box-shadow:0 4px 14px var(--sh);transition:.2s;color:#8b8b92}
.nav button.on{color:var(--ink)}
.nav button.on::after{content:"";position:absolute}
.nav .plus{width:76px;background:var(--acc);color:#fff;box-shadow:0 8px 22px rgba(255,91,20,.4)}
.nav button:active{transform:scale(.94)}

/* sheets */
.ov{position:fixed;inset:0;background:rgba(10,10,12,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.ov.show{opacity:1;pointer-events:auto}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:30px 30px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));max-height:93vh;overflow:auto;transform:translateY(40px);transition:transform .35s cubic-bezier(.2,.9,.3,1)}
.ov.show .sheet{transform:none}
.sheet .hd{width:38px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 16px}
.sheet h3{font-size:21px;font-weight:700;letter-spacing:-.02em}
.sheet .sub{font-size:13.5px;color:var(--mute);margin-top:4px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--mute);text-transform:uppercase;margin:18px 2px 8px}
.field{width:100%;height:54px;padding:0 16px;border-radius:16px;border:1px solid var(--line);background:var(--field);font-size:16px;outline:none;transition:border-color .2s}
.field:focus{border-color:var(--ink)}
.seg{display:flex;gap:6px;background:var(--soft);padding:5px;border-radius:18px}
.seg button{flex:1;height:44px;border-radius:14px;font-weight:600;color:#6e6e75;font-size:14.5px;transition:.15s}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.seg button:disabled{opacity:.35}
.seg.t button.on.i{color:var(--in)}.seg.t button.on.o{color:var(--out)}
.amount{display:flex;align-items:center;background:var(--field);border-radius:20px;border:1px solid var(--line);padding:6px 6px 6px 18px;gap:8px}
.amount input{flex:1;min-width:0;border:0;outline:none;font-size:34px;font-weight:700;letter-spacing:-.03em;height:58px;background:none}
.stp{width:48px;height:48px;border-radius:14px;background:var(--soft);font-size:22px;font-weight:600}
.prev{margin-top:12px;padding:14px 16px;border-radius:18px;background:var(--field);font-size:14px;line-height:1.55;border:1px solid var(--line)}
.prev b{font-weight:700}
.row{display:flex;gap:8px;align-items:center}
.sp{flex:1}
.menu .mi{display:flex;align-items:center;gap:14px;width:100%;padding:16px;background:var(--card);border-radius:18px;margin-top:8px;text-align:left;font-weight:600}
.menu .mi span{flex:1}

/* SHA-256 (works offline & on file://) */
function sha256(s){const K=[],H=[];let n=2,c=0;const isP=x=>{for(let i=2;i*i<=x;i++)if(x%i==0)return false;return true};while(c<64){if(isP(n)){if(c<8)H[c]=(Math.pow(n,.5)*4294967296)|0;K[c++]=(Math.pow(n,1/3)*4294967296)|0}n++}
const b=unescape(encodeURIComponent(s)),l=b.length,w=[];for(let i=0;i<l;i++)w[i>>2]|=b.charCodeAt(i)<<((3-i%4)*8);w[l>>2]|=0x80<<((3-l%4)*8);const nw=((l+8>>6)+1)*16;w[nw-1]=l*8;for(let i=0;i<nw;i++)w[i]|=0;
const rr=(v,a)=>(v>>>a)|(v<<(32-a));let h=H.slice();
for(let j=0;j<nw;j+=16){const W=w.slice(j,j+16),o=h.slice();for(let i=0;i<64;i++){if(i>=16){const a=W[i-15],d=W[i-2];W[i]=(W[i-16]+(rr(a,7)^rr(a,18)^(a>>>3))+W[i-7]+(rr(d,17)^rr(d,19)^(d>>>10)))|0}

for(let i=0;i<8;i++)h[i]=(h[i]+o[i])|0}

function split(p,base){ /* -> [{u,k}] greedy largest first */

  return out;
}

    <div class="stat"><div class="ic">${IC.inn}</div><div style="min-width:0"><div class="lb">Bugungi kirim</div><div class="vl">${tIn}${diff(tIn,yIn)}</div></div></div>
    <div class="stat"><div class="ic">${IC.out}</div><div style="min-width:0"><div class="lb">Bugungi chiqim</div><div class="vl">${tOut}${diff(tOut,yOut)}</div></div></div>
  </div>`;
  /* day strip */
  h+=`<h2 class="sec" style="margin-bottom:8px">${selDay===t?"Bugun":fmtDate(selDay)}<span class="sp"></span><input type="date" id="pickDay" value="${selDay}" style="position:absolute;opacity:0;width:1px;height:1px"><button class="link" data-act="pickday">Sana tanlash</button></h2><div class="days" id="days">`;
  for(let i=-5;i<=1;i++){
    const ds=addDays(selDay===t||Math.abs((dObj(selDay)-dObj(t))/864e5)<=3?t:selDay,i),d=dObj(ds);
    const has=txs.some(x=>x.date===ds);
    h+=`<button class="day ${ds===selDay?"on":""} ${ds>t?"fut":""}" data-act="day" data-d="${ds}"><div class="wd">${HAF[d.getDay()]}</div><div class="dn">${d.getDate()}${has?'<i class="mk"></i>':""}</div></button>`;

  /* product tabs + hero */

  const parts=split(p,bal),first=parts[0],rest=parts.slice(1);
  const dIn=dayT.filter(x=>x.pid===p.id&&x.type==="in").reduce((a,x)=>a+x.base,0);
  const dOut=dayT.filter(x=>x.pid===p.id&&x.type==="out").reduce((a,x)=>a+x.base,0);
  const net=dIn-dOut;
  const pctv=Math.max(0,Math.min(1,bal/mx));
  const R=50,C=2*Math.PI*R,arc=C*0.75;

    <div class="tabs">${sortP().map(x=>`<button class="tab ${x.id===p.id?"on":""}" data-act="selp" data-pid="${x.id}">${esc(x.name)}</button>`).join("")}</div>

        <div class="big ${bal<0?"neg":""}" style="white-space:nowrap;${(()=>{const L=((bal<0?"−":"")+(first?num(first.k):"0")).length;return L>8?"font-size:30px":L>6?"font-size:38px":L>4?"font-size:44px":""})()}">${bal<0?"−":""}${first?num(first.k):"0"}<small>${first?first.u:mu}</small></div>
        <div class="rest">${rest.length?"+ "+rest.map(x=>num(x.k)+" "+x.u).join(" "):"&nbsp;"}</div>
        <div class="rest" style="margin-top:2px">${isEt(p)?(p.donaKg>0?"≈ "+num(bal/p.donaKg)+" dona etiketka":"Etiketka · kg hisobida"):"jami "+num(bal)+" dona"}</div>
      </div>
      <div class="ring">
        <svg width="118" height="118" viewBox="0 0 118 118"><circle cx="59" cy="59" r="${R}" fill="none" style="stroke:var(--track)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${arc} ${C}"/>
        <circle cx="59" cy="59" r="${R}" fill="none" stroke="${bal<0?"#dc2626":"#ff8a1f"}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${arc*pctv} ${C}" style="transition:stroke-dasharray .8s"/></svg>
        <div class="c"><b class="${net<0?"neg":""}" style="${net>0?"color:var(--in)":""}">${net>0?"+":net<0?"−":""}${num(Math.abs(net)/mf)}</b><span>${mu.toUpperCase()}</span><span style="letter-spacing:.06em;font-weight:600;margin-top:2px">${selDay===t?"BUGUN":"SHU KUN"}</span></div>
      </div>
    </div>
    <div class="mini3">
      <div class="mini"><div class="lb"><span style="color:var(--in)">●</span> KIRIM</div><div class="vl">${num(dIn/mf)} <small>${mu}</small></div><div class="bar"><i style="width:${Math.min(100,dIn/mx*100)}%;background:var(--in)"></i></div><div class="ft">${isEt(p)?(p.donaKg>0?"≈ "+num(dIn/p.donaKg)+" dona":kindName(p)):num(dIn)+" dona"}</div></div>
      <div class="mini"><div class="lb"><span style="color:var(--out)">●</span> CHIQIM</div><div class="vl">${num(dOut/mf)} <small>${mu}</small></div><div class="bar"><i style="width:${Math.min(100,dOut/mx*100)}%;background:var(--out)"></i></div><div class="ft">${isEt(p)?(p.donaKg>0?"≈ "+num(dOut/p.donaKg)+" dona":kindName(p)):num(dOut)+" dona"}</div></div>
      <div class="mini"><div class="lb"><span style="color:var(--plan)">●</span> REJA</div><div class="vl">${futP.length} <small>ta</small></div><div class="bar"><i style="width:${futP.length?Math.min(100,Math.abs(allBal)/mx*100):0}%;background:var(--plan)"></i></div><div class="ft">keyin: ${breakdown(p,allBal)}</div></div>
    </div>
    <div class="qa"><button class="qbtn i" data-act="add" data-type="in" data-pid="${p.id}">＋ Kirim</button><button class="qbtn o" data-act="add" data-type="out" data-pid="${p.id}">− Chiqim</button></div>
    ${bal<0||allBal<0?`<div class="warn">⚠ Qoldiq minusga tushyapti — chiqim kirimdan ko'p yozilgan. Yozuvlarni tekshiring.</div>`:""}
  </div>`;
  /* day list */
  const list=dayT.slice().sort((a,b)=>(b.at||0)-(a.at||0));
  h+=`<h2 class="sec">${selDay===t?"Bugungi amallar":fmtDate(selDay)+" amallari"}<span class="sp"></span><small>${list.length} ta</small></h2>`;
  h+=list.length?`<div class="list">${list.map(txRow).join("")}</div>`:`<div class="card empty">${selDay>t?"Bu kunga reja yozilmagan.":"Bu kunda kirim/chiqim yo'q."}<div style="margin-top:14px"><button class="btn dark" data-act="add" data-date="${selDay}">+ Amal qo'shish</button></div></div>`;
  return h+"</div>";
}
function txRow(t){
  const p=prodById(t.pid),isIn=t.type==="in",fut=t.date>today();
  return `<div class="it"><div class="ib" style="background:${isIn?"var(--inbg)":"var(--outbg)"}">${isIn?IC.inn:IC.out}</div>

function vReport(){
  let h=`<div class="fadein"><h2 class="sec">Hisobot</h2>`;
  if(!products.length)return h+noProducts()+"</div>";
  if(!prodById(repPid))repPid=prodById(selPid)?selPid:sortP()[0].id;
  const p=prodById(repPid),mu=mainUnit(p),mf=factors(p)[mu],t=today();
  h+=`<div class="panel"><div class="tabs">${sortP().map(x=>`<button class="tab ${x.id===p.id?"on":""}" data-act="repp" data-pid="${x.id}">${esc(x.name)}</button>`).join("")}</div>`;
  /* chart */
  const lastF=txs.filter(x=>x.pid===p.id&&x.date>t).map(x=>x.date).sort().pop();const ahead=lastF?Math.min(14,Math.round((dObj(lastF)-dObj(t))/864e5)):0;
  const days=[];for(let i=repRange-1;i>=-ahead;i--)days.push(today(-i));const tIdx=repRange-1;
  const bals=days.map(d=>balance(p.id,d)/mf);
  const ins=days.map(d=>txs.filter(x=>x.pid===p.id&&x.date===d&&x.type==="in").reduce((a,x)=>a+x.base,0)/mf);
  const outs=days.map(d=>txs.filter(x=>x.pid===p.id&&x.date===d&&x.type==="out").reduce((a,x)=>a+x.base,0)/mf);
  const W=320,H=170,L=30,B=22,T=10,maxV=Math.max(1,...bals,...ins,...outs),minV=Math.min(0,...bals);
  const nice=v=>{const e=Math.pow(10,Math.floor(Math.log10(v)));const f=v/e;return (f<=1?1:f<=2?2:f<=5?5:10)*e};
  const top=nice(maxV),bot=minV<0?-nice(-minV):0;
  const X=i=>L+(W-L-6)*(days.length===1?0.5:i/(days.length-1));
  const Y=v=>T+(H-T-B)*(1-(v-bot)/(top-bot));
  let g="";for(let k=0;k<=4;k++){const v=bot+(top-bot)*k/4;g+=`<line x1="${L}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line)" stroke-dasharray="3 4"/><text x="${L-6}" y="${Y(v)+4}" font-size="10" fill="#9a9aa2" text-anchor="end">${num(v)}</text>`}
  const bw=Math.max(2,Math.min(10,(W-L)/days.length/3));
  days.forEach((d,i)=>{if(ins[i])g+=`<rect x="${X(i)-bw-1}" y="${Y(ins[i])}" width="${bw}" height="${Y(0)-Y(ins[i])}" rx="${bw/2}" fill="#16a34a" opacity=".55"/>`;if(outs[i])g+=`<rect x="${X(i)+1}" y="${Y(outs[i])}" width="${bw}" height="${Y(0)-Y(outs[i])}" rx="${bw/2}" fill="#dc2626" opacity=".5"/>`});
  const path=bals.map((v,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)).join(" ");
  const area=path+` L${X(days.length-1)} ${Y(Math.max(bot,0))} L${X(0)} ${Y(Math.max(bot,0))} Z`;
  const labIdx=[0,Math.floor((days.length-1)/3),Math.floor(2*(days.length-1)/3),days.length-1];
  labIdx.forEach(i=>{const d=dObj(days[i]);g+=`<text x="${X(i)}" y="${H-4}" font-size="10" fill="#9a9aa2" text-anchor="${i===0?"start":i===days.length-1?"end":"middle"}">${d.getDate()} ${OY[d.getMonth()].slice(0,3)}</text>`});
  h+=`<div class="card"><div class="row"><b style="font-size:17px;letter-spacing:-.02em">Qoldiq dinamikasi</b><span class="sp"></span>
    <button class="sel" data-act="range">${repRange===7?"7 kun":repRange===14?"14 kun":"30 kun"} ${IC.chev}</button></div>
    <div class="mute" style="font-size:12px;color:var(--mute);margin:4px 0 10px">${mu} hisobida · <span style="color:#ff5b14">━</span> qoldiq <span style="color:#16a34a">▮</span> kirim <span style="color:#dc2626">▮</span> chiqim</div>
    <svg class="chart" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5b14" stop-opacity=".22"/><stop offset="1" stop-color="#ff5b14" stop-opacity="0"/></linearGradient></defs>${g}
    <path d="${area}" fill="url(#ga)"/><path d="${path}" fill="none" stroke="#ff5b14" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    ${ahead?`<rect x="${X(tIdx)}" y="${T}" width="${X(days.length-1)-X(tIdx)}" height="${H-T-B}" fill="#8b5cf6" opacity=".06"/><text x="${X(days.length-1)}" y="${T+10}" font-size="10" fill="#8b5cf6" text-anchor="end">reja</text>`:""}
    <circle cx="${X(tIdx)}" cy="${Y(bals[tIdx])}" r="4.5" style="fill:var(--card)" stroke="#ff5b14" stroke-width="2.5"/></svg></div>`;
  /* daily table */
  const list=sortedTx(p.id);
  if(list.length){
    const by={};for(const x of list){(by[x.date]=by[x.date]||{in:0,out:0})[x.type]+=x.base}
    let s=0;const rows=[];for(const d of Object.keys(by).sort()){s+=by[d].in-by[d].out;rows.push({d,...by[d],bal:s})}
    const tin=list.filter(x=>x.type==="in").reduce((a,x)=>a+x.base,0),tout=list.filter(x=>x.type==="out").reduce((a,x)=>a+x.base,0);
    h+=`<div class="card" style="margin-top:8px"><div class="row" style="margin-bottom:6px"><b style="font-size:17px;letter-spacing:-.02em">Kunlik hisob</b><span class="sp"></span><span class="chip n">${mu}</span></div>
    <table><thead><tr><th>Sana</th><th>Kirim</th><th>Chiqim</th><th>Qoldiq</th></tr></thead><tbody>
    ${rows.reverse().map(r=>`<tr><td>${fmtDate(r.d)}${r.d>t?' <span class="chip p">reja</span>':""}</td><td style="color:var(--in)">${r.in?"+"+num(r.in/mf):"—"}</td><td style="color:var(--out)">${r.out?"−"+num(r.out/mf):"—"}</td><td class="${r.bal<0?"neg":""}"><b>${num(r.bal/mf)}</b></td></tr>`).join("")}
    </tbody></table>
    <div class="row" style="margin-top:12px;gap:8px"><div class="mini" style="flex:1;background:var(--inbg);border:0"><div class="lb" style="color:var(--in)">JAMI KIRIM</div><div class="vl" style="color:var(--in)">${num(tin/mf)} <small>${mu}</small></div></div>
    <div class="mini" style="flex:1;background:var(--outbg);border:0"><div class="lb" style="color:var(--out)">JAMI CHIQIM</div><div class="vl" style="color:var(--out)">${num(tout/mf)} <small>${mu}</small></div></div></div></div>
    <button class="btn w" style="margin-top:8px;background:var(--card)" data-act="csv">Jadvalni nusxalash (Excel uchun)</button>`;
  }else h+=`<div class="card empty" style="margin-top:8px">Bu mahsulot bo'yicha hali yozuv yo'q.</div>`;
  return h+`</div></div>`;
}

const lock={mode:"loading",buf:"",first:"",len:4,busy:false,flow:null,tmp:{}};
function buildPad(){
  const k=[["1",""],["2","ABC"],["3","DEF"],["4","GHI"],["5","JKL"],["6","MNO"],["7","PQRS"],["8","TUV"],["9","WXYZ"],["",""],["0",""],["⌫",""]];

function buildPins(n){
  lock.len=n;const ps=$("#pins");ps.classList.toggle("six",n===6);
  const w=n===6?46:58,g=n===6?8:12;
  ps.innerHTML=Array.from({length:n},(_,i)=>{const off=(i-(n-1)/2)*(w+g);const tx=-off+(i-(n-1)/2)*3;const rot=((i-(n-1)/2)*2.6).toFixed(1);return `<div class="pin" style="--tx:${tx}px;--rot:${rot}deg"></div>`}).join("");
}
function lkText(title,sub,err){

const SECRET_MODES=["login","bossOld","s3","s4"];
function drawPins(){
  document.querySelectorAll(".pin").forEach((p,i)=>{const f=i<lock.buf.length;p.classList.toggle("f",f);p.classList.toggle("a",i===lock.buf.length&&!lock.busy);

}
function lockedUntil(){const t=lsGet(LS_TRY,{n:0,until:0});return t.until>Date.now()?t.until:0}
function showPad(on){$(".pins-wrap").classList.toggle("hidden",!on);$("#pad").classList.toggle("hidden",!on);$("#nameBox").classList.toggle("hidden",on)}
function setMode(m){

  $("#pad").classList.remove("off");showPad(true);
  if(m==="loading"){buildPins(4);lkText("Ulanmoqda…","Umumiy omborga ulanyapmiz");$("#pad").classList.add("off")}

  else if(m==="name"){showPad(false);lkText(lock.flow==="setup"?"Omborni sozlash":"Xush kelibsiz",lock.flow==="setup"?"Siz birinchi kiruvchisiz — omborni siz sozlaysiz (boshliq).<br>Avval ismingizni yozing.":"Ismingizni yozing — yozuvlar yonida kim kiritgani ko'rinadi.");setTimeout(()=>$("#nameIn").focus(),300)}

  else if(m==="s3"){buildPins(6);lkText("Boshliq paroli","Faqat sizga ma'lum 6 xonali parol. Ombor parolini o'zgartirish uchun kerak bo'ladi.")}

function wrongTry(){
  const t=lsGet(LS_TRY,{n:0,until:0});t.n++;let msg="Noto'g'ri parol. Qayta urinib ko'ring.";
  if(t.n>=5){t.until=Date.now()+30000*Math.pow(2,Math.min(t.n-5,5));t.n=4;msg="Juda ko'p xato. "+Math.round((t.until-Date.now())/1000)+" soniya kuting."}
  lsSet(LS_TRY,t);pinError(msg);
}
function busyText(t){lock.prevTitle=$("#lkTitle").textContent;lkText(t,"&nbsp;");$("#pad").classList.add("off")}
async function pinDone(){
  const pin=lock.buf,m=lock.mode;
  try{
  if(m==="s1"){lock.tmp.code=pin;setTimeout(()=>setMode("s2"),180);return}
  if(m==="s2"){if(pin!==lock.tmp.code){pinError("Mos kelmadi. Qaytadan o'ylab toping.");setTimeout(()=>setMode("s1"),900);return}setTimeout(()=>setMode("s3"),180);return}
  if(m==="s3"){lock.tmp.boss=pin;setTimeout(()=>setMode("s4"),180);return}
  if(m==="s4"){
    if(pin!==lock.tmp.boss){pinError("Mos kelmadi. Qaytadan kiriting.");setTimeout(()=>setMode("s3"),900);return}
    busyText("Ombor yaratilmoqda…");
    const salt=uid()+uid(),uidv=fauth.currentUser.uid,code=hashPin(lock.tmp.code,salt),adminCode=hashPin(lock.tmp.boss,salt+"#boss");
    await withTimeout(FB.setDoc(D("config","public"),{salt,setup:true,createdAt:FB.serverTimestamp(),by:myName()}),15000);
    await withTimeout(FB.setDoc(D("config","access"),{code,adminCode}),15000);
    await withTimeout(FB.setDoc(D("members",uidv),{code,name:myName(),boss:true,at:FB.serverTimestamp()}),15000);
    pub={salt};const meRec=lsGet(LS_ME,{});meRec.code=code;meRec.boss=true;lsSet(LS_ME,meRec);lock.tmp={};
    success("Ombor tayyor!");return}
  if(m==="login"){
    const until=lockedUntil();if(until){pinError("Juda ko'p urinish. "+Math.ceil((until-Date.now())/1000)+" soniya kuting.");return}
    const code=hashPin(pin,pub.salt);busyText("Tekshirilmoqda…");
    try{
      await withTimeout(FB.setDoc(D("members",fauth.currentUser.uid),{code,name:myName(),at:FB.serverTimestamp()}),9000);
    }catch(e){
      if(e.code==="timeout"&&lsGet(LS_ME,{}).code===code){ /* offline but this phone already knew this PIN */ }
      else{ $("#pad").classList.remove("off"); if(isDenied(e))return wrongTry(); if(e.code==="timeout"){pinError("Internet sekin yoki yo'q. Qayta urinib ko'ring.");return} throw e }
    }
    lsSet(LS_TRY,{n:0,until:0});const r=lsGet(LS_ME,{});r.code=code;lsSet(LS_ME,r);
    success("Muvaffaqiyatli kirildi");return}
  if(m==="bossOld"){lock.tmp.boss=pin;setTimeout(()=>setMode("c1"),180);return}
  if(m==="c1"){lock.tmp.code=pin;setTimeout(()=>setMode("c2"),180);return}
  if(m==="c2"){
    if(pin!==lock.tmp.code){pinError("Mos kelmadi.");setTimeout(()=>setMode("c1"),900);return}
    busyText("Saqlanmoqda…");
    const code=hashPin(lock.tmp.code,pub.salt),adminCode=hashPin(lock.tmp.boss,pub.salt+"#boss");
    try{await withTimeout(FB.setDoc(D("config","access"),{code,adminCode}),12000)}
    catch(e){$("#pad").classList.remove("off");lock.tmp={};if(isDenied(e)){pinError("Boshliq paroli noto'g'ri.");setTimeout(()=>setMode("bossOld"),1000);return}pinError("Internet yo'q — saqlanmadi.");return}
    await withTimeout(FB.setDoc(D("members",fauth.currentUser.uid),{code,name:myName(),boss:true,at:FB.serverTimestamp()}),12000).catch(()=>{});
    const r=lsGet(LS_ME,{});r.code=code;r.boss=true;lsSet(LS_ME,r);lock.tmp={};lock.toastAfter="Yangi ombor paroli o'rnatildi ✓";
    success("Parol yangilandi");return}
  }catch(e){console.warn(e);$("#pad").classList.remove("off");pinError(e&&e.code==="timeout"?"Internet sekin yoki yo'q. Qayta urinib ko'ring.":"Xatolik: "+(e&&e.code||"noma'lum"))}
}
function pinError(msg){
  vib([60,40,60]);const ps=$("#pins");ps.classList.remove("err");void ps.offsetWidth;ps.classList.add("err");
  lkText(lock.prevTitle||$("#lkTitle").textContent,msg,true);lock.prevTitle=null;

function lockKey(k){
  if(lock.busy||$("#lock").classList.contains("gone")||$("#pad").classList.contains("off")||$("#pad").classList.contains("hidden"))return;
  if(k==="del"){lock.buf=lock.buf.slice(0,-1);drawPins();return}
  if(lock.buf.length>=lock.len)return;

}

  box.innerHTML=`<div class="list fadein">${res.map(p=>{const b=balance(p.id,t);return `<div class="it" data-act="pick" data-pid="${p.id}" style="cursor:pointer"><div class="ib">${pIcon(p)}</div>
    <div class="mid"><div class="nm">${esc(p.name)}</div><div class="tg"><span>${kindName(p)}</span></div></div>
    <div class="amt" style="min-width:80px"><b class="${b<0?"neg":""}">${breakdown(p,b)}</b><span>qoldiq</span></div>
    <button class="x" data-act="add" data-pid="${p.id}" data-type="in" aria-label="Kirim" style="color:var(--in);background:var(--inbg)">＋</button></div>`}).join("")}</div>`;
}
$("#sq").addEventListener("input",renderSearch);
$("#sclr").addEventListener("click",e=>{e.preventDefault();$("#sq").value="";renderSearch();$("#sq").focus()});

/* ================= events ================= */
$("#nav").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.v){view=b.dataset.v;render();window.scrollTo({top:0,behavior:"smooth"})}});
$("#ov").addEventListener("click",e=>{if(e.target.id==="ov")closeSheet()});
document.addEventListener("change",e=>{if(e.target.id==="pickDay"&&e.target.value){selDay=e.target.value;render()}});
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  if(a==="close")closeSheet();
  else if(a==="menu")menuSheet();
  else if(a==="lock")showLock("login");
  else if(a==="chpin"){showLock("bossOld")}
  else if(a==="upold"){closeSheet();uploadOld()}
  else if(a==="rename"){openSheet(`<h3>Ismingiz</h3><div class="sub">Kirim/chiqim yozuvlari yonida shu ism ko'rinadi.</div><div class="lbl">Ism</div><input class="field" id="rn" value="${esc(myName())}" maxlength="24"><div class="row" style="margin-top:18px"><button class="btn" data-act="close" style="flex:1;background:var(--card)">Bekor</button><button class="btn dark" style="flex:1.4" data-act="saverename">Saqlash</button></div>`)}
  else if(a==="saverename"){const n=$("#rn").value.trim().slice(0,24);if(n.length<2){toast("Ismni yozing");return}const r=lsGet(LS_ME,{});r.name=n;lsSet(LS_ME,r);closeSheet();toast("Saqlandi ✓");if(fauth&&fauth.currentUser&&r.code)FB.setDoc(D("members",fauth.currentUser.uid),{code:r.code,name:n,at:FB.serverTimestamp()}).catch(()=>{})}
  else if(a==="newp")productForm();
  else if(a==="newpq"){productForm();setTimeout(()=>{$("#pn").value=$("#sq").value.trim()},0)}
  else if(a==="pick"){selPid=b.dataset.pid;view="home";$("#sq").value="";renderSearch();$("#sq").blur();render();setTimeout(()=>{const h=document.querySelector(".panel");if(h)h.scrollIntoView({behavior:"smooth",block:"start"})},60)}
  else if(a==="theme"){const t=document.documentElement.dataset.theme==="dark"?"light":"dark";applyTheme(t);lsSet(LS_THEME,t);vib(10)}
  else if(a==="editp")productForm(prodById(b.dataset.pid));
  else if(a==="add")txForm({pid:b.dataset.pid,type:b.dataset.type,date:b.dataset.date});
  else if(a==="edit")txForm({id:b.dataset.id});
  else if(a==="day"){selDay=b.dataset.d;render()}
  else if(a==="pickday"){const i=$("#pickDay");try{i.showPicker?i.showPicker():i.click()}catch(err){i.click()}}
  else if(a==="selp"){selPid=b.dataset.pid;render()}
  else if(a==="repp"){repPid=b.dataset.pid;render()}
  else if(a==="hf"){histFilter=b.dataset.k;render()}
  else if(a==="range"){repRange=repRange===7?14:repRange===14?30:7;render()}
  else if(a==="savep"){
    const name=$("#pn").value.trim();if(!name){toast("Mahsulot nomini yozing");$("#pn").focus();return}
    if(products.some(p=>p.name.toLowerCase()===name.toLowerCase()&&p.id!==b.dataset.pid)){toast("Bu nomli mahsulot bor");return}
    const kind=$("#sheet").dataset.kind||"karobka";const old=prodById(b.dataset.pid);
    let p;
    if(kind==="etiketka"){
      const kd=+$("#pkd").value||0;if(kd<0){toast("Manfiy son bo'lmaydi");return}
      p={id:b.dataset.pid||uid(),name,kind:"etiketka",donaKg:kd,v:2};
    }else{
      const bl=+$("#pb").value||0,pp=+$("#pp").value||0,pu=$("#ppu .on").dataset.pu;
      if(bl<0||pp<0){toast("Manfiy son bo'lmaydi");return}
      if(pp&&pu==="blok"&&!bl){toast("Avval 1 blokdagi donani kiriting");return}
      p={id:b.dataset.pid||uid(),name,kind:"karobka",blok:bl,pachka:pu==="blok"?pp*bl:pp,pachkaIn:pu};
    }
    closeSheet();if(!b.dataset.pid)selPid=p.id;
    await saveProduct(p);toast("Saqlandi ✓");
  }
  else if(a==="delp"){const p=prodById(b.dataset.pid);const n=txs.filter(t=>t.pid===p.id).length;confirmSheet("Mahsulotni o'chirish?",`<b>${esc(p.name)}</b> va uning ${n} ta yozuvi o'chiriladi.`,"O'chirish",()=>{deleteProduct(p.id);toast("O'chirildi")})}
  else if(a==="deltx"){e.stopPropagation();const id=b.dataset.id;confirmSheet("Yozuvni o'chirish?","Bu yozuv o'chiriladi va qoldiq qayta hisoblanadi.","O'chirish",()=>{deleteTx(id);toast("O'chirildi")})}
  else if(a==="savetx"){
    const q=parseFloat($("#fq").value);if(!(q>0)){toast("Miqdorni kiriting");$("#fq").focus();return}
    const p=prodById(form.pid),f=factors(p);
    const t={id:form.id||uid(),pid:form.pid,type:form.type,qty:q,unit:form.unit,base:q*f[form.unit],date:form.date||today(),note:$("#fn").value.trim(),at:form.at||Date.now()};
    closeSheet();selPid=t.pid;await saveTx(t);toast((t.type==="in"?"Kirim":"Chiqim")+" saqlandi ✓");
  }
  else if(a==="csv"){
    const p=prodById(repPid);let s=0,out="Sana\tMahsulot\tTuri\tMiqdor\tBirlik\tAsosiy miqdor ("+baseUnit(p)+")\tQoldiq ("+baseUnit(p)+")\tIzoh\n";
    for(const t of sortedTx(p.id)){s+=sgn(t);out+=[t.date,p.name,t.type==="in"?"Kirim":"Chiqim",t.qty,t.unit,t.base,s,t.note||""].join("\t")+"\n"}
    let ok=false;try{await navigator.clipboard.writeText(out);ok=true}catch(err){}
    if(!ok){try{const ta=document.createElement("textarea");ta.value=out;document.body.appendChild(ta);ta.select();ok=document.execCommand("copy");ta.remove()}catch(err){}}
    toast(ok?"Nusxalandi — Excelga joylang":"Nusxalab bo'lmadi");
  }
});

(function start(){
  buildPad();
  const h=new Date().getHours();
  $("#hello").textContent=(h<5?"Xayrli tun":h<11?"Xayrli tong":h<18?"Xayrli kun":"Xayrli kech")+(myName()?", "+myName():"")+" 👋";
  boot();
})();
})();
</script>
